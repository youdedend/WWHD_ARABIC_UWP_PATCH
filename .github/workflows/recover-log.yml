name: Recover timed-out build log

on:
  push:
    branches:
      - arena/50e1336b-wwhd-arabic-uwp-patch
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover log
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 40921111280 --repo $env:GITHUB_REPOSITORY --log > "$env:RUNNER_TEMP/cancelled.log"
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve cancelled log' }
          Get-Content "$env:RUNNER_TEMP/cancelled.log" | Select-Object -Last 2000 | Set-Content 'cancelled-build-log.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cancelled-build-log.txt
          git commit -m 'Recover timed-out build diagnostics [skip ci]'
          git push origin HEAD:arena/50e1336b-wwhd-arabic-uwp-patch
